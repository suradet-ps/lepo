<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lepo — monitor your GitHub repositories in one place." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbf9" />
    <title>Lepo — GitHub Repo Monitor</title>

    <!-- Favicon -->
    <link data-trunk rel="icon" type="image/svg+xml" href="public/favicon.svg" />

    <!-- Inter font (Pin Sans substitute per DESIGN.md) — loaded without blocking first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Application styles -->
    <link data-trunk rel="css" href="src/style.css" />

    <!-- WASM entry point -->
    <link data-trunk rel="rust" />
  </head>
  <body></body>
</html>
